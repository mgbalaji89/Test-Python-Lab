name: Tamil News Report

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tamil-news-report
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run Python tests
        run: pytest -q

      - name: Compile scraper
        run: python -m py_compile scrape_tamil_news.py

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Scrape Tamil news headlines
        run: python scrape_tamil_news.py

      - name: Validate HTML report
        run: |
          test -s tamil_news_report.html
          grep -q "Dinamalar" tamil_news_report.html
          grep -q "Daily Thanthi" tamil_news_report.html
          grep -q "Total headlines" tamil_news_report.html

      - name: Prepare GitHub Pages site
        run: |
          rm -rf site
          mkdir -p site
          cp tamil_news_report.html site/index.html

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: tamil-news-report
          path: tamil_news_report.html
          if-no-files-found: error

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
