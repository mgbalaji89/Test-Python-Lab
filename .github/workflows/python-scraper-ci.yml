name: Python Scraper CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run scraper
        run: python scrape.py

      - name: Validate JSON output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output = Path("Headlines.json")
          if not output.exists():
              raise SystemExit("Headlines.json was not generated")

          data = json.loads(output.read_text(encoding="utf-8"))
          headlines = data.get("headlines", [])

          if not headlines:
              raise SystemExit("Headlines.json contains no headlines")

          print(f"Validated {len(headlines)} headlines")
          PY

      - name: Upload headlines artifact
        uses: actions/upload-artifact@v4
        with:
          name: hindu-headlines
          path: Headlines.json
